apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-app
  namespace: default
  labels:
    app: html-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-app
  template:
    metadata:
      labels:
        app: html-app
    spec:
      containers:
      - name: html-container
        image: __DOCKERHUB_USER__/html-app:__BUILD_NUMBER__
        imagePullPolicy: Always
        ports:
        - containerPort: 80